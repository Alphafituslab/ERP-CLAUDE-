<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alpha Connect</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Tema visual 3D — camada adicional, ver comentário no topo do arquivo. -->
<link rel="stylesheet" href="/static/tema-3d.css">

<!-- Casca própria do App de Vendas externo (Fase 154) — mesmo app.js/
     backend de sempre, só uma "pele" diferente pra instalar no celular/
     tablet do vendedor: nome "Alpha Connect" em vez de "Alphafitus OS",
     ícone/manifest próprios. window.__ORIGEM_APP__ abaixo é lido pela
     tela de login (app.js) pra decidir qual marca mostrar — sem esse
     marcador (quem acessa por "/" normalmente), continua "Alphafitus OS". -->
<script>window.__ORIGEM_APP__ = "vendas";</script>
<link rel="manifest" href="/manifest_vendas.json">
<meta name="theme-color" content="#00875f">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alpha Connect">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="app">
  <div class="carregando">Carregando…</div>
</div>
<script src="/static/app.js" defer></script>
<script src="/static/tema-3d.js" defer></script>
</body>
</html>
