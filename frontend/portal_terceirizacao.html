<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Sua Linha — Alphafitus</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --preto: #0c0d0e;
    --grafite: #17191b;
    --grafite-claro: #1f2225;
    --borda: #2c2f33;
    --dourado: #c9a44c;
    --dourado-suave: #a8863f;
    --texto: #ece9e2;
    --texto-suave: #9a978f;
    --sucesso: #6fae6f;
    --erro: #c96a4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--preto); color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--borda);
  }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca-nome { font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto); font-weight: 600; }
  .marca-sub { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dourado); }
  .selo-seguro { font-size: 11px; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
  .titulo-projeto { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .subtitulo-projeto { color: var(--texto-suave); font-size: 14px; margin: 0 0 28px; }
  .cartao {
    background: var(--grafite); border: 1px solid var(--borda); border-radius: 10px;
    padding: 22px 24px; margin-bottom: 20px;
  }
  .cartao h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dourado);
    margin: 0 0 16px; font-weight: 600;
  }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12.5px; color: var(--texto-suave); margin-bottom: 6px; }
  .campo input[type="text"], .campo textarea, .campo select {
    width: 100%; background: var(--preto); border: 1px solid var(--borda); border-radius: 6px;
    padding: 10px 12px; color: var(--texto); font-size: 14px; font-family: inherit;
  }
  .campo input:focus, .campo textarea:focus, .campo select:focus { outline: none; border-color: var(--dourado-suave); }
  .campo textarea { resize: vertical; min-height: 60px; }
  .grade-opcoes { display: flex; gap: 10px; flex-wrap: wrap; }
  .opcao-embalagem {
    width: 108px; text-align: center; background: var(--grafite-claro); border: 2px solid var(--borda);
    border-radius: 8px; padding: 10px; cursor: pointer; color: var(--texto);
  }
  .opcao-embalagem.selecionada { border-color: var(--dourado); box-shadow: 0 0 0 1px var(--dourado); }
  .opcao-embalagem img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 6px; }
  .opcao-embalagem .sem-foto { width: 64px; height: 64px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--texto-suave); }
  .opcao-embalagem .nome { font-size: 12px; }
  .opcao-embalagem .cor { font-size: 10.5px; color: var(--texto-suave); }
  .botao {
    background: var(--dourado); color: #1a1408; border: none; border-radius: 6px; padding: 11px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.01em;
  }
  .botao:hover { background: #d9b65c; }
  .botao:disabled { opacity: 0.5; cursor: not-allowed; }
  .botao-secundario {
    background: none; color: var(--texto); border: 1px solid var(--borda); border-radius: 6px;
    padding: 10px 18px; font-size: 13.5px; cursor: pointer;
  }
  .botao-secundario:hover { border-color: var(--dourado-suave); }
  .estilos-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--borda); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .chip.selecionado { background: var(--dourado); color: #1a1408; border-color: var(--dourado); }
  .mockup-preview { width: 100%; border-radius: 8px; border: 1px solid var(--borda); display: block; }
  .selo-status {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--grafite-claro); border: 1px solid var(--borda); color: var(--texto-suave); margin-left: 10px; vertical-align: middle;
  }
  .aviso { background: rgba(201, 164, 76, 0.1); border: 1px solid var(--dourado-suave); border-radius: 8px; padding: 14px 16px; font-size: 13.5px; margin-bottom: 20px; }
  .erro { background: rgba(201, 106, 76, 0.12); border: 1px solid var(--erro); border-radius: 8px; padding: 14px 16px; font-size: 13.5px; }
  .tela-central { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 40px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--borda); }
  th { color: var(--texto-suave); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .lista-arquivos { list-style: none; padding: 0; margin: 12px 0 0; }
  .lista-arquivos li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--borda); font-size: 13px; }
  .lista-arquivos a { color: var(--dourado); text-decoration: none; }
  .rodape-acoes { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
  .marca-linha { display: flex; gap: 8px; margin-bottom: 8px; }
  .marca-linha input { flex: 1; }
  .removerlinha { background: none; border: 1px solid var(--borda); color: var(--texto-suave); border-radius: 6px; width: 36px; cursor: pointer; }
  .texto-suave { color: var(--texto-suave); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="topo">
  <div class="marca">
    <div>
      <div class="marca-nome">Alphafitus</div>
      <div class="marca-sub">Monte Sua Linha</div>
    </div>
  </div>
  <div class="selo-seguro">🔒 Conexão segura e privada</div>
</div>

<div class="container" id="app">
  <div class="tela-central"><p class="texto-suave">Carregando seu projeto…</p></div>
</div>

<script>
(function () {
  const partes = location.pathname.split("/").filter(Boolean);
  const token = partes[partes.length - 1];
  const API = location.origin + "/api/v1/portal/terceirizacao";
  const app = document.getElementById("app");

  const ESTILOS_VISUAIS = [
    "Luxuoso", "Premium", "Minimalista", "Natural", "Esportivo", "Clínico", "Farmacêutico",
    "Clean", "Feminino", "Masculino", "Tecnológico", "Jovem", "Elegante", "Sofisticado",
  ];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Mesma tabela de Informação Nutricional real (Porções por embalagem/
  // Porção/nutriente|quantidade|%VD) que a tela interna já mostra — ver
  // renderizarTabelaNutricional em frontend/static/app.js e
  // _extrair_nutrientes em app/routes/terceirizacao.py.
  function renderizarTabelaNutricional(tabela) {
    if (!tabela) return "";
    if (tabela.tipo === "texto_livre") {
      return `<p class="texto-suave" style="white-space:pre-wrap;">${escapeHtml(tabela.conteudo)}</p>`;
    }
    if (tabela.tipo !== "estruturado" && tabela.tipo !== "estruturado_alimento") return "";
    const colunaQtd = tabela.porcao_gramas ? `${tabela.porcao_gramas} g` : "Quantidade";
    return `
      ${tabela.porcoes_por_embalagem ? `<p class="texto-suave" style="margin:4px 0;">Porções por embalagem: ${escapeHtml(String(tabela.porcoes_por_embalagem))}</p>` : ""}
      ${(tabela.porcao_gramas || tabela.descricao_porcao) ? `<p class="texto-suave" style="margin:4px 0;">Porção${tabela.porcao_gramas ? `: ${escapeHtml(String(tabela.porcao_gramas))} g` : ""}${tabela.descricao_porcao ? ` (${escapeHtml(tabela.descricao_porcao)})` : ""}</p>` : ""}
      <table><thead><tr><th></th><th>${escapeHtml(colunaQtd)}</th><th>%VD*</th></tr></thead>
      <tbody>${(tabela.linhas || []).map((l) => `<tr><td>${escapeHtml(l.nutriente || "")}</td><td>${escapeHtml(l.quantidade != null ? String(l.quantidade) : "0")}</td><td>${escapeHtml(l.vd || "**")}</td></tr>`).join("")}</tbody></table>
      ${tabela.rodape_vd ? `<p class="texto-suave" style="font-size:11px;margin-top:4px;">${escapeHtml(tabela.rodape_vd)}</p>` : ""}
    `;
  }

  async function chamar(caminho, opcoes) {
    opcoes = opcoes || {};
    const resp = await fetch(API + caminho, {
      method: opcoes.method || "GET",
      headers: { "Content-Type": "application/json" },
      body: opcoes.body !== undefined ? JSON.stringify(opcoes.body) : undefined,
    });
    let dados = {};
    try { dados = await resp.json(); } catch (e) { /* corpo vazio */ }
    if (!resp.ok) {
      const erro = new Error(dados.mensagem || `Erro ${resp.status}`);
      erro.codigo = dados.erro;
      throw erro;
    }
    return dados;
  }

  function telaErro(mensagem) {
    app.innerHTML = `<div class="tela-central">
      <div style="font-size:36px;">🔒</div>
      <h2 style="margin:0;font-weight:600;">Não foi possível abrir este link</h2>
      <p class="texto-suave" style="max-width:420px;">${escapeHtml(mensagem)}</p>
    </div>`;
  }

  function lerArquivoComoBase64(arquivo) {
    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onload = () => resolve(leitor.result);
      leitor.onerror = reject;
      leitor.readAsDataURL(arquivo);
    });
  }

  // Fase 146 — um projeto pode ter vários itens agora, cada um com
  // fórmula/embalagem próprias; `estadoLocal` guarda a seleção de
  // pote/tampa/cápsula EM ANDAMENTO por item (chave = item.id), pra não
  // perder o clique no pote antes de escolher a tampa.
  let estadoLocalPorItem = {};

  async function renderizar() {
    let projeto;
    try {
      projeto = await chamar(`/${token}`);
    } catch (erro) {
      if (erro.codigo === "link_expirado") return telaErro("Este link expirou. Entre em contato com seu vendedor na Alphafitus para receber um novo link.");
      return telaErro("Este link é inválido ou já foi revogado. Confira se copiou o endereço completo, ou peça um novo link ao seu contato na Alphafitus.");
    }

    const editavel = projeto.editavel;
    const briefing = projeto.briefing || {};
    const estiloAtual = briefing.estilo_visual ? JSON.parse(briefing.estilo_visual) : [];
    const coresAtuais = briefing.cores_preferidas ? JSON.parse(briefing.cores_preferidas) : [];
    const marcasAtuais = briefing.marcas_referencia ? JSON.parse(briefing.marcas_referencia) : [];
    const itens = projeto.itens || [];

    // Busca as opções de embalagem POR ITEM (tampas compatíveis dependem
    // do pote de CADA item, que pode ser diferente entre eles).
    const embalagemPorItem = {};
    await Promise.all(itens.map(async (it) => {
      estadoLocalPorItem[it.id] = estadoLocalPorItem[it.id] || { pote_id: it.pote_id, tampa_id: it.tampa_id, capsula_id: it.capsula_id };
      const est = estadoLocalPorItem[it.id];
      try {
        embalagemPorItem[it.id] = await chamar(`/${token}/embalagem-disponivel${est.pote_id ? `?pote_id=${est.pote_id}` : ""}`);
      } catch (e) {
        embalagemPorItem[it.id] = { potes: [], tampas: [], capsulas: [] };
      }
    }));

    function opcaoEmbalagem(o, campo, selecionadoId, itemId) {
      const cor = o.cor || o.cor_cabeca || "";
      return `<div class="opcao-embalagem ${String(o.id) === String(selecionadoId) ? "selecionada" : ""}" data-campo="${campo}" data-id="${o.id}" data-item-id="${itemId}" ${editavel ? "" : 'style="cursor:default;"'}>
        ${o.imagem ? `<img src="${o.imagem}">` : '<div class="sem-foto">sem foto</div>'}
        <div class="nome">${escapeHtml(o.nome)}</div>
        <div class="cor">${escapeHtml(cor)}</div>
      </div>`;
    }

    app.innerHTML = `
      <h1 class="titulo-projeto">${escapeHtml(projeto.numero)} <span class="selo-status">${editavel ? "Preenchimento aberto" : "Enviado — em análise"}</span></h1>
      <p class="subtitulo-projeto">${escapeHtml(projeto.cliente.razao_social)}</p>

      ${!editavel ? `<div class="aviso">Seu projeto já foi enviado para a Alphafitus e está em análise interna. Se precisar alterar algo, entre em contato com seu vendedor.${projeto.assinatura_cliente_nome ? `<br>Confirmado por ${escapeHtml(projeto.assinatura_cliente_nome)}.` : ""}</div>` : ""}

      <div class="cartao">
        <h2>Documento completo</h2>
        <a href="${API}/${token}/documento.pdf" target="_blank" class="botao-secundario" style="text-decoration:none;display:inline-block;">📄 Ver documento completo (PDF)</a>
      </div>

      ${itens.map((it, idx) => `
      <div class="cartao">
        <h2>${itens.length > 1 ? `Item ${idx + 1} — ` : ""}Fórmula</h2>
        <img class="mockup-preview" id="mockup-img-${it.id}" alt="Preview do produto" style="max-width:220px;display:block;margin:0 auto 14px;">
        ${it.item ? `
          <p><strong>${escapeHtml(it.item.nome_memorial || it.item.descricao)}</strong></p>
          ${it.nutricao && it.nutricao.vinculado_a_memorial && it.nutricao.memorial_aprovado_encontrado ? `
            ${renderizarTabelaNutricional(it.nutricao.tabela_nutricional)}
            ${it.nutricao.lista_ingredientes ? `<p style="margin-top:10px;"><strong>Lista de Ingredientes:</strong> ${escapeHtml(it.nutricao.lista_ingredientes)}</p>` : ""}
          ` : '<p class="texto-suave">Tabela nutricional ainda não disponível para este produto.</p>'}
          ${editavel ? `
            <div style="margin-top:14px;">
              <button type="button" class="botao-secundario btn-solicitar-alteracao" data-item-id="${it.id}">Solicitar alteração da fórmula</button>
            </div>` : ""}
        ` : '<p class="texto-suave">Fórmula ainda não definida pela equipe Alphafitus.</p>'}
        ${it.solicitacao_alteracao_formula ? `<div class="aviso" style="margin-top:14px;">Alteração solicitada: ${escapeHtml(it.solicitacao_alteracao_formula)}</div>` : ""}
      </div>

      <div class="cartao">
        <h2>Personalização da Embalagem${itens.length > 1 ? ` (item ${idx + 1})` : ""}</h2>
        <div class="campo"><label>Pote</label>
          <div class="grade-opcoes">${(embalagemPorItem[it.id].potes || []).map((o) => opcaoEmbalagem(o, "pote_id", estadoLocalPorItem[it.id].pote_id, it.id)).join("") || '<p class="texto-suave">Nenhuma opção disponível.</p>'}</div>
        </div>
        <div class="campo"><label>Tampa</label>
          <div class="grade-opcoes">${(embalagemPorItem[it.id].tampas || []).map((o) => opcaoEmbalagem(o, "tampa_id", estadoLocalPorItem[it.id].tampa_id, it.id)).join("") || '<p class="texto-suave">Escolha um pote primeiro.</p>'}</div>
        </div>
        <div class="campo"><label>Cápsula</label>
          <div class="grade-opcoes">${(embalagemPorItem[it.id].capsulas || []).map((o) => opcaoEmbalagem({ ...o, cor: o.cor_cabeca }, "capsula_id", estadoLocalPorItem[it.id].capsula_id, it.id)).join("") || '<p class="texto-suave">Nenhuma opção disponível.</p>'}</div>
        </div>
        <div style="display:flex;gap:12px;margin-top:6px;">
          <div class="campo" style="flex:1;"><label>Quantidade por pote</label><input type="text" class="campo-quantidade" data-item-id="${it.id}" value="${it.quantidade_por_pote ?? ""}" ${editavel ? "" : "disabled"}></div>
          <div class="campo" style="flex:1;"><label>Unidade</label>
            <select class="campo-unidade" data-item-id="${it.id}" ${editavel ? "" : "disabled"}>
              <option value="">—</option>
              <option value="capsulas" ${it.unidade_quantidade === "capsulas" ? "selected" : ""}>Cápsulas</option>
              <option value="gramas" ${it.unidade_quantidade === "gramas" ? "selected" : ""}>Gramas</option>
            </select>
          </div>
        </div>
        ${editavel ? `<button type="button" class="botao-secundario btn-salvar-embalagem" data-item-id="${it.id}">Salvar embalagem e quantidade</button>` : ""}
      </div>
      `).join("")}

      <div class="cartao">
        <h2>Conte-nos sobre sua marca</h2>
        <div class="campo"><label>Qual é a ideia do projeto?</label><textarea id="b-ideia" ${editavel ? "" : "disabled"}>${escapeHtml(briefing.ideia_projeto || "")}</textarea></div>
        <div class="campo"><label>Qual público deseja atingir?</label><textarea id="b-publico" ${editavel ? "" : "disabled"}>${escapeHtml(briefing.publico_alvo || "")}</textarea></div>
        <div class="campo"><label>Qual posicionamento?</label><textarea id="b-posicionamento" ${editavel ? "" : "disabled"}>${escapeHtml(briefing.posicionamento || "")}</textarea></div>
        <div class="campo"><label>Que sensação deseja transmitir?</label><textarea id="b-sensacao" ${editavel ? "" : "disabled"}>${escapeHtml(briefing.sensacao_desejada || "")}</textarea></div>
        <div class="campo"><label>Estilo visual (escolha quantos quiser)</label>
          <div class="estilos-chips" id="chips-estilo">
            ${ESTILOS_VISUAIS.map((e) => `<div class="chip ${estiloAtual.includes(e) ? "selecionado" : ""}" data-estilo="${e}" ${editavel ? "" : 'style="pointer-events:none;opacity:.7;"'}>${e}</div>`).join("")}
          </div>
        </div>
        <div class="campo"><label>Cores preferidas (uma por linha, HEX)</label><textarea id="b-cores" placeholder="#000000" ${editavel ? "" : "disabled"}>${coresAtuais.join("\n")}</textarea></div>
        <div class="campo">
          <label>Marcas ou produtos que te inspiram</label>
          <div id="marcas-container">
            ${marcasAtuais.map((m) => `<div class="marca-linha"><input type="text" placeholder="Nome" value="${escapeHtml(m.nome || "")}" data-campo="nome" ${editavel ? "" : "disabled"}><input type="text" placeholder="Site/Instagram" value="${escapeHtml(m.site || "")}" data-campo="site" ${editavel ? "" : "disabled"}>${editavel ? '<button type="button" class="removerlinha">✕</button>' : ""}</div>`).join("")}
          </div>
          ${editavel ? '<button type="button" class="botao-secundario" id="btn-add-marca" style="margin-top:6px;">+ Adicionar marca de referência</button>' : ""}
        </div>
        ${editavel ? '<button type="button" class="botao-secundario" id="btn-salvar-briefing">Salvar</button>' : ""}
      </div>

      <div class="cartao">
        <h2>Referências e Anexos</h2>
        ${editavel ? `
          <div class="campo"><label>Enviar arquivo (JPG, PNG, WEBP ou PDF, até 10 MB)</label>
            <input type="file" id="campo-arquivo" accept=".jpg,.jpeg,.png,.webp,.pdf">
          </div>
          <button type="button" class="botao-secundario" id="btn-enviar-arquivo">Enviar</button>
        ` : ""}
        <ul class="lista-arquivos">
          ${(projeto.arquivos || []).map((a) => `<li><span>${escapeHtml(a.nome)}</span><a href="${API}/${token}/arquivos/${a.id}/download" target="_blank">Ver</a></li>`).join("") || '<li class="texto-suave">Nenhum arquivo enviado ainda.</li>'}
        </ul>
      </div>

      ${(projeto.artes || []).length ? `
        <div class="cartao">
          <h2>Arte do rótulo/embalagem</h2>
          <p class="texto-suave" style="margin-bottom:16px;">Aprove ou peça alteração na versão mais recente. Versões anteriores ficam guardadas abaixo, só pra consulta.</p>
          ${projeto.artes.map((a, idx) => `
            <div style="padding:12px 0;${idx > 0 ? "border-top:1px solid rgba(255,255,255,.08);" : ""}">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                <strong>Versão ${a.versao}</strong>
                <a href="${API}/${token}/artes/${a.versao}/arquivo" target="_blank" class="botao-secundario" style="padding:4px 10px;font-size:13px;">Ver arquivo</a>
              </div>
              ${a.observacoes ? `<p class="texto-suave" style="margin:4px 0;">${escapeHtml(a.observacoes)}</p>` : ""}
              ${a.status === "aprovado" ? `<p style="color:#5fbf7f;margin:6px 0 0;">✓ Aprovado${a.decidido_por_nome ? ` por ${escapeHtml(a.decidido_por_nome)}` : ""}</p>`
                : a.status === "alteracao_solicitada" ? `<p style="color:#d98c4a;margin:6px 0 0;">Alteração solicitada${a.decidido_por_nome ? ` por ${escapeHtml(a.decidido_por_nome)}` : ""}: ${escapeHtml(a.solicitacao_texto || "")}</p>`
                : idx === 0 ? `
                  <div id="decisao-arte-${a.versao}" style="margin-top:10px;text-align:left;">
                    <div class="campo"><label>Seu nome</label><input type="text" class="arte-decisao-nome" data-versao="${a.versao}"></div>
                    <div class="rodape-acoes">
                      <button type="button" class="botao-secundario botao-arte-alterar" data-versao="${a.versao}">Pedir alteração</button>
                      <button type="button" class="botao botao-arte-aprovar" data-versao="${a.versao}">Aprovar esta arte →</button>
                    </div>
                  </div>` : '<p class="texto-suave" style="margin:6px 0 0;">Aguardando decisão sobre a versão mais recente.</p>'}
            </div>`).join("")}
        </div>
      ` : ""}

      <div class="cartao">
        <h2>Comentários</h2>
        <div style="max-height:240px;overflow-y:auto;margin-bottom:12px;text-align:left;">
          ${(projeto.comentarios || []).map((c) => `
            <div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);">
              <div style="display:flex;justify-content:space-between;gap:8px;">
                <strong>${escapeHtml(c.autor_nome)}</strong>
                <span class="texto-suave" style="font-size:12px;">${new Date(c.criado_em).toLocaleString("pt-BR")}</span>
              </div>
              <p style="margin:4px 0 0;white-space:pre-wrap;">${escapeHtml(c.texto)}</p>
            </div>`).join("") || '<p class="texto-suave">Nenhum comentário ainda.</p>'}
        </div>
        <div class="campo"><label>Seu nome</label><input type="text" id="comentario-nome"></div>
        <div class="campo"><label>Comentário</label><textarea id="comentario-texto" rows="2"></textarea></div>
        <button type="button" class="botao-secundario" id="btn-enviar-comentario">Comentar</button>
      </div>

      ${editavel ? `
        <div class="cartao" id="cartao-concluir" style="text-align:center;">
          <div id="passo-revisar">
            <p class="texto-suave" style="margin-bottom:16px;">Reveja o preview e o documento completo acima. Quando estiver tudo certo, clique abaixo.</p>
            <button type="button" class="botao" id="btn-concluir">Está tudo certo, confirmar →</button>
          </div>
          <div id="passo-assinatura" hidden style="text-align:left;">
            <p style="text-align:center;margin-top:0;">Pra confirmar, digite seu nome e e-mail abaixo — isso serve como sua confirmação de que revisou e aprovou tudo o que está aqui.</p>
            <div class="campo"><label>Seu nome completo</label><input type="text" id="assinatura-nome"></div>
            <div class="campo"><label>Seu e-mail (opcional)</label><input type="text" id="assinatura-email"></div>
            <div class="rodape-acoes">
              <button type="button" class="botao-secundario" id="btn-cancelar-assinatura">Voltar</button>
              <button type="button" class="botao" id="btn-confirmar-assinatura">Confirmar e Enviar →</button>
            </div>
          </div>
        </div>
      ` : ""}

      ${projeto.status === "aguardando_assinatura" ? `
        <div class="cartao" id="cartao-assinar" style="text-align:center;">
          <h2>Assinatura eletrônica</h2>
          <p class="texto-suave" style="margin-bottom:16px;">Sua especificação já passou pela análise interna da Alphafitus e está pronta. Pra formalizar, assine eletronicamente abaixo — isso gera um documento definitivo com data, hora e um código de verificação únicos, e a partir daqui os dados ficam travados (qualquer mudança precisa de uma nova versão).</p>
          <div style="text-align:left;max-width:420px;margin:0 auto;">
            <div class="campo"><label>Seu nome completo</label><input type="text" id="assinatura2-nome"></div>
            <div class="campo"><label>Seu CPF</label><input type="text" id="assinatura2-cpf" placeholder="000.000.000-00"></div>
            <div class="campo"><label>Seu e-mail (opcional)</label><input type="text" id="assinatura2-email"></div>
          </div>
          <button type="button" class="botao" id="btn-assinar" style="margin-top:10px;">Assinar eletronicamente →</button>
        </div>
      ` : ""}

      ${projeto.assinatura_eletronica ? `
        <div class="cartao" style="text-align:center;">
          <h2>Documento assinado</h2>
          <p>Assinado eletronicamente por <strong>${escapeHtml(projeto.assinatura_eletronica.assinante_nome)}</strong> em ${new Date(projeto.assinatura_eletronica.assinado_em).toLocaleString("pt-BR")}.</p>
          <p class="texto-suave" style="word-break:break-all;">Código de verificação (hash SHA-256): ${escapeHtml(projeto.assinatura_eletronica.hash_pdf_sha256)}</p>
        </div>
      ` : ""}
    `;

    // Fase 146 — preview do mockup POR ITEM: se já existe uma captura 3D
    // salva (feita pela equipe interna ou pelo próprio cliente), usa ela
    // direto (é só uma imagem estática, não precisa carregar Three.js
    // aqui no portal); senão cai pro cartão 2D de sempre (blob, sem
    // precisar de auth — token já valida).
    itens.forEach((it) => {
      const img = document.getElementById(`mockup-img-${it.id}`);
      if (!img) return;
      if (it.mockup_3d_imagem) { img.src = it.mockup_3d_imagem; return; }
      fetch(`${API}/${token}/itens/${it.id}/mockup.png`).then((r) => r.blob()).then((b) => {
        img.src = URL.createObjectURL(b);
      }).catch(() => {});
    });

    // Fase 140 — o botão de assinatura de verdade fica FORA do `editavel`
    // (que só cobre aguardando_cliente/em_preenchimento) — sem isso, o
    // early-return logo abaixo pularia esse listener inteiro sempre que
    // o projeto chegasse em 'aguardando_assinatura'.
    const btnAssinar = document.getElementById("btn-assinar");
    if (btnAssinar) {
      btnAssinar.addEventListener("click", async () => {
        const nome = document.getElementById("assinatura2-nome").value.trim();
        const cpf = document.getElementById("assinatura2-cpf").value.trim();
        const email = document.getElementById("assinatura2-email").value.trim();
        if (!nome) { alert("Informe seu nome."); return; }
        if (cpf.replace(/\D/g, "").length !== 11) { alert("Informe um CPF válido."); return; }
        if (!confirm("Confirma a assinatura eletrônica deste documento? Depois disso os dados ficam travados.")) return;
        try {
          btnAssinar.disabled = true;
          btnAssinar.textContent = "Assinando…";
          await chamar(`/${token}/assinar`, { method: "POST", body: { nome, cpf, email } });
          renderizar();
        } catch (erro) {
          alert(erro.message || "Não foi possível assinar.");
          btnAssinar.disabled = false;
          btnAssinar.textContent = "Assinar eletronicamente →";
        }
      });
    }

    // Fase 145 — arte e comentários ficam disponíveis em QUALQUER status
    // do projeto, por isso ficam fora do `if (!editavel) return` abaixo.
    document.querySelectorAll(".botao-arte-aprovar").forEach((botao) => {
      botao.addEventListener("click", async () => {
        const versao = botao.dataset.versao;
        const nome = document.querySelector(`.arte-decisao-nome[data-versao="${versao}"]`).value.trim();
        if (!nome) { alert("Informe seu nome."); return; }
        try {
          await chamar(`/${token}/artes/${versao}/decidir`, { method: "POST", body: { nome, status: "aprovado" } });
          renderizar();
        } catch (erro) { alert(erro.message || "Não foi possível registrar a aprovação."); }
      });
    });
    document.querySelectorAll(".botao-arte-alterar").forEach((botao) => {
      botao.addEventListener("click", async () => {
        const versao = botao.dataset.versao;
        const nome = document.querySelector(`.arte-decisao-nome[data-versao="${versao}"]`).value.trim();
        if (!nome) { alert("Informe seu nome."); return; }
        const solicitacao_texto = prompt("O que precisa mudar nesta arte?");
        if (!solicitacao_texto || !solicitacao_texto.trim()) return;
        try {
          await chamar(`/${token}/artes/${versao}/decidir`, { method: "POST", body: { nome, status: "alteracao_solicitada", solicitacao_texto } });
          renderizar();
        } catch (erro) { alert(erro.message || "Não foi possível registrar a solicitação."); }
      });
    });
    const btnEnviarComentario = document.getElementById("btn-enviar-comentario");
    if (btnEnviarComentario) {
      btnEnviarComentario.addEventListener("click", async () => {
        const nome = document.getElementById("comentario-nome").value.trim();
        const texto = document.getElementById("comentario-texto").value.trim();
        if (!nome) { alert("Informe seu nome."); return; }
        if (!texto) { alert("Escreva um comentário."); return; }
        try {
          await chamar(`/${token}/comentarios`, { method: "POST", body: { nome, texto } });
          renderizar();
        } catch (erro) { alert(erro.message || "Não foi possível enviar o comentário."); }
      });
    }

    if (!editavel) return; // resto da função só liga eventos de edição

    async function salvarEmbalagem(itemId) {
      const est = estadoLocalPorItem[itemId];
      const campoQtd = document.querySelector(`.campo-quantidade[data-item-id="${itemId}"]`);
      const campoUnidade = document.querySelector(`.campo-unidade[data-item-id="${itemId}"]`);
      try {
        await chamar(`/${token}/itens/${itemId}/embalagem`, {
          method: "PUT",
          body: {
            pote_id: est.pote_id, tampa_id: est.tampa_id, capsula_id: est.capsula_id,
            quantidade_por_pote: campoQtd.value ? Number(campoQtd.value) : null,
            unidade_quantidade: campoUnidade.value || null,
          },
        });
        renderizar();
      } catch (erro) {
        alert(erro.message || "Não foi possível salvar.");
        renderizar();
      }
    }

    document.querySelectorAll(".opcao-embalagem").forEach((el) => {
      el.addEventListener("click", () => {
        const campo = el.dataset.campo;
        const itemId = el.dataset.itemId;
        estadoLocalPorItem[itemId][campo] = Number(el.dataset.id);
        if (campo === "pote_id") estadoLocalPorItem[itemId].tampa_id = null;
        salvarEmbalagem(itemId);
      });
    });
    document.querySelectorAll(".btn-salvar-embalagem").forEach((btn) => {
      btn.addEventListener("click", () => salvarEmbalagem(btn.dataset.itemId));
    });

    const containerMarcas = document.getElementById("marcas-container");
    const btnAddMarca = document.getElementById("btn-add-marca");
    if (btnAddMarca) {
      btnAddMarca.addEventListener("click", () => {
        const linha = document.createElement("div");
        linha.className = "marca-linha";
        linha.innerHTML = `<input type="text" placeholder="Nome" data-campo="nome"><input type="text" placeholder="Site/Instagram" data-campo="site"><button type="button" class="removerlinha">✕</button>`;
        containerMarcas.appendChild(linha);
      });
    }
    containerMarcas.addEventListener("click", (e) => {
      if (e.target.classList.contains("removerlinha")) e.target.closest(".marca-linha").remove();
    });

    document.querySelectorAll("#chips-estilo .chip").forEach((chip) => {
      chip.addEventListener("click", () => chip.classList.toggle("selecionado"));
    });

    const btnSalvarBriefing = document.getElementById("btn-salvar-briefing");
    if (btnSalvarBriefing) {
      btnSalvarBriefing.addEventListener("click", async () => {
        const estilos = [...document.querySelectorAll("#chips-estilo .chip.selecionado")].map((c) => c.dataset.estilo);
        const cores = (document.getElementById("b-cores").value || "").split("\n").map((s) => s.trim()).filter(Boolean);
        const marcas = [...containerMarcas.querySelectorAll(".marca-linha")].map((linha) => ({
          nome: linha.querySelector('[data-campo="nome"]').value.trim(),
          site: linha.querySelector('[data-campo="site"]').value.trim(),
        })).filter((m) => m.nome || m.site);
        try {
          await chamar(`/${token}/briefing`, {
            method: "PUT",
            body: {
              ideia_projeto: document.getElementById("b-ideia").value,
              publico_alvo: document.getElementById("b-publico").value,
              posicionamento: document.getElementById("b-posicionamento").value,
              sensacao_desejada: document.getElementById("b-sensacao").value,
              estilo_visual: estilos, cores_preferidas: cores, marcas_referencia: marcas,
            },
          });
          btnSalvarBriefing.textContent = "Salvo ✓";
          setTimeout(() => { btnSalvarBriefing.textContent = "Salvar"; }, 2000);
        } catch (erro) {
          alert(erro.message || "Não foi possível salvar.");
        }
      });
    }

    document.querySelectorAll(".btn-solicitar-alteracao").forEach((btnSolicitarAlteracao) => {
      btnSolicitarAlteracao.addEventListener("click", async () => {
        const texto = prompt("Descreva a alteração desejada na fórmula:");
        if (!texto || !texto.trim()) return;
        try {
          await chamar(`/${token}/itens/${btnSolicitarAlteracao.dataset.itemId}/solicitar-alteracao-formula`, { method: "PUT", body: { texto } });
          renderizar();
        } catch (erro) {
          alert(erro.message || "Não foi possível enviar.");
        }
      });
    });

    const btnEnviarArquivo = document.getElementById("btn-enviar-arquivo");
    if (btnEnviarArquivo) {
      btnEnviarArquivo.addEventListener("click", async () => {
        const campoArquivo = document.getElementById("campo-arquivo");
        const arquivo = campoArquivo.files[0];
        if (!arquivo) { alert("Escolha um arquivo primeiro."); return; }
        try {
          const dataUrl = await lerArquivoComoBase64(arquivo);
          await chamar(`/${token}/arquivos`, {
            method: "POST",
            body: { nome_arquivo: arquivo.name, tipo_mime: arquivo.type, dados: dataUrl, categoria: "referencia" },
          });
          renderizar();
        } catch (erro) {
          alert(erro.message || "Não foi possível enviar o arquivo.");
        }
      });
    }

    const btnConcluir = document.getElementById("btn-concluir");
    if (btnConcluir) {
      btnConcluir.addEventListener("click", () => {
        document.getElementById("passo-revisar").hidden = true;
        document.getElementById("passo-assinatura").hidden = false;
        document.getElementById("assinatura-nome").focus();
      });
      document.getElementById("btn-cancelar-assinatura").addEventListener("click", () => {
        document.getElementById("passo-assinatura").hidden = true;
        document.getElementById("passo-revisar").hidden = false;
      });
      document.getElementById("btn-confirmar-assinatura").addEventListener("click", async () => {
        const nome = document.getElementById("assinatura-nome").value.trim();
        const email = document.getElementById("assinatura-email").value.trim();
        if (!nome) { alert("Digite seu nome para confirmar."); return; }
        try {
          await chamar(`/${token}/concluir`, { method: "POST", body: { nome, email } });
          renderizar();
        } catch (erro) {
          alert(erro.message || "Não foi possível concluir.");
        }
      });
    }
  }

  renderizar();
})();
</script>
</body>
</html>
