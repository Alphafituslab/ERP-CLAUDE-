<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monte Sua Linha — Alphafitus</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --preto: #0c0d0e;
    --grafite: #17191b;
    --grafite-claro: #1f2225;
    --borda: #2c2f33;
    --dourado: #c9a44c;
    --dourado-suave: #a8863f;
    --texto: #ece9e2;
    --texto-suave: #9a978f;
    --sucesso: #6fae6f;
    --erro: #c96a4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--preto); color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--borda);
  }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca-nome { font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto); font-weight: 600; }
  .marca-sub { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dourado); }
  .selo-seguro { font-size: 11px; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
  .titulo-projeto { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .subtitulo-projeto { color: var(--texto-suave); font-size: 14px; margin: 0 0 28px; }
  .cartao {
    background: var(--grafite); border: 1px solid var(--borda); border-radius: 10px;
    padding: 22px 24px; margin-bottom: 20px;
  }
  .cartao h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dourado);
    margin: 0 0 16px; font-weight: 600;
  }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12.5px; color: var(--texto-suave); margin-bottom: 6px; }
  .campo input[type="text"], .campo textarea, .campo select {
    width: 100%; background: var(--preto); border: 1px solid var(--borda); border-radius: 6px;
    padding: 10px 12px; color: var(--texto); font-size: 14px; font-family: inherit;
  }
  .campo input:focus, .campo textarea:focus, .campo select:focus { outline: none; border-color: var(--dourado-suave); }
  .campo textarea { resize: vertical; min-height: 60px; }
  .grade-opcoes { display: flex; gap: 10px; flex-wrap: wrap; }
  .opcao-embalagem {
    width: 108px; text-align: center; background: var(--grafite-claro); border: 2px solid var(--borda);
    border-radius: 8px; padding: 10px; cursor: pointer; color: var(--texto);
  }
  .opcao-embalagem.selecionada { border-color: var(--dourado); box-shadow: 0 0 0 1px var(--dourado); }
  .opcao-embalagem img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 6px; }
  .opcao-embalagem .sem-foto { width: 64px; height: 64px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--texto-suave); }
  .opcao-embalagem .nome { font-size: 12px; }
  .opcao-embalagem .cor { font-size: 10.5px; color: var(--texto-suave); }
  .botao {
    background: var(--dourado); color: #1a1408; border: none; border-radius: 6px; padding: 11px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.01em;
  }
  .botao:hover { background: #d9b65c; }
  .botao:disabled { opacity: 0.5; cursor: not-allowed; }
  .botao-secundario {
    background: none; color: var(--texto); border: 1px solid var(--borda); border-radius: 6px;
    padding: 10px 18px; font-size: 13.5px; cursor: pointer;
  }
  .botao-secundario:hover { border-color: var(--dourado-suave); }
  .estilos-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--borda); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; user-select: none; }
  .chip.selecionado { background: var(--dourado); color: #1a1408; border-color: var(--dourado); }
  .mockup-preview { width: 100%; border-radius: 8px; border: 1px solid var(--borda); display: block; }
  .selo-status {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--grafite-claro); border: 1px solid var(--borda); color: var(--texto-suave); margin-left: 10px; vertical-align: middle;
  }
  .aviso { background: rgba(201, 164, 76, 0.1); border: 1px solid var(--dourado-suave); border-radius: 8px; padding: 14px 16px; font-size: 13.5px; margin-bottom: 20px; }
  .erro { background: rgba(201, 106, 76, 0.12); border: 1px solid var(--erro); border-radius: 8px; padding: 14px 16px; font-size: 13.5px; }
  .tela-central { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 40px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--borda); }
  th { color: var(--texto-suave); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .lista-arquivos { list-style: none; padding: 0; margin: 12px 0 0; }
  .lista-arquivos li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--borda); font-size: 13px; }
  .lista-arquivos a { color: var(--dourado); text-decoration: none; }
  .rodape-acoes { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
  .marca-linha { display: flex; gap: 8px; margin-bottom: 8px; }
  .marca-linha input { flex: 1; }
  .removerlinha { background: none; border: 1px solid var(--borda); color: var(--texto-suave); border-radius: 6px; width: 36px; cursor: pointer; }
  .texto-suave { color: var(--texto-suave); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="topo">
  <div class="marca">
    <div>
      <div class="marca-nome">Alphafitus</div>
      <div class="marca-sub">Monte Sua Linha</div>
    </div>
  </div>
  <div class="selo-seguro">🔒 Conexão segura e privada</div>
</div>

<div class="container" id="app">
  <div class="tela-central"><p class="texto-suave">Carregando seu projeto…</p></div>
</div>

<script src="/static/portal_terceirizacao.js" defer></script>
</body>
</html>
