<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato — Alphafitus</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --preto: #0c0d0e;
    --grafite: #17191b;
    --grafite-claro: #1f2225;
    --borda: #2c2f33;
    --dourado: #c9a44c;
    --dourado-suave: #a8863f;
    --texto: #ece9e2;
    --texto-suave: #9a978f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--preto); color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--borda);
  }
  .marca-nome { font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto); font-weight: 600; }
  .marca-sub { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dourado); }
  .selo-seguro { font-size: 11px; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }
  .container { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  .titulo { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitulo { color: var(--texto-suave); font-size: 14px; margin: 0 0 28px; }
  .cartao {
    background: var(--grafite); border: 1px solid var(--borda); border-radius: 10px;
    padding: 22px 24px; margin-bottom: 20px;
  }
  .cartao h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dourado);
    margin: 0 0 16px; font-weight: 600;
  }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12.5px; color: var(--texto-suave); margin-bottom: 6px; }
  .campo input[type="text"] {
    width: 100%; background: var(--preto); border: 1px solid var(--borda); border-radius: 6px;
    padding: 10px 12px; color: var(--texto); font-size: 14px; font-family: inherit;
  }
  .campo input:focus { outline: none; border-color: var(--dourado-suave); }
  .botao {
    background: var(--dourado); color: #1a1408; border: none; border-radius: 6px; padding: 11px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.01em;
  }
  .botao:hover { background: #d9b65c; }
  .botao:disabled { opacity: 0.5; cursor: not-allowed; }
  .botao-secundario {
    background: none; color: var(--texto); border: 1px solid var(--borda); border-radius: 6px;
    padding: 10px 18px; font-size: 13.5px; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .botao-secundario:hover { border-color: var(--dourado-suave); }
  .selo-status {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--grafite-claro); border: 1px solid var(--borda); color: var(--texto-suave); margin-left: 10px; vertical-align: middle;
  }
  .texto-contrato {
    white-space: pre-wrap; font-size: 13.5px; line-height: 1.6; max-height: 420px; overflow-y: auto;
    background: var(--preto); border: 1px solid var(--borda); border-radius: 8px; padding: 16px;
  }
  .tela-central { min-height: 60vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 40px; }
  .texto-suave { color: var(--texto-suave); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="topo">
  <div>
    <div class="marca-nome">Alphafitus</div>
    <div class="marca-sub">Contrato</div>
  </div>
  <div class="selo-seguro">🔒 Conexão segura e privada</div>
</div>

<div class="container" id="app">
  <div class="tela-central"><p class="texto-suave">Carregando o contrato…</p></div>
</div>

<script src="/static/portal_contrato.js" defer></script>
</body>
</html>
